server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para optimizar transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad HTTP esenciales
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Soporte para descargas directas de binarios y APKs
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe bin dmg;
            text/plain txt;
        }
        add_header Cache-Control "public, max-age=86400";
    }

    # Caché persistente para activos compilados con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon y robots
    location = /favicon.svg {
        expires 7d;
        access_log off;
    }
    location = /robots.txt {
        expires 7d;
        access_log off;
    }

    # SPA routing: Redirigir cualquier ruta interna hacia index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Página de error personalizada
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
